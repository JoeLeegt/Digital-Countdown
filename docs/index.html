/* El diseño es negro por definición; los tokens se repiten para cualquier tema. */
:root {
  --bg: #000;
  --rgb: 255, 42, 32;          /* rojo */
  --c: rgb(var(--rgb));
  --ghost: rgba(var(--rgb), .1);
  --dim: rgba(var(--rgb), .27);
  --soft: rgba(var(--rgb), .68);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root.green { --rgb: 46, 255, 96; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
:root[data-theme="dark"] { --bg: #000; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--c);
  font-family: "D14", ui-monospace, "Courier New", monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus { outline: none; }
::selection { background: transparent; }

.view { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.hidden { display: none !important; }

/* ---------- Vista de configuración ---------- */
#setup {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(28px, 7vh, 58px);
  overflow-y: auto;
}
.mode { display: flex; gap: clamp(28px, 6vw, 56px); font-size: clamp(16px, 2.6vw, 22px); }
.mode button { color: var(--dim); padding: 6px 0 8px; border-bottom: 2px solid transparent; transition: color .15s; }
.mode button.on { color: var(--c); text-shadow: 0 0 .25em rgba(var(--rgb), .45); }
.mode button.on:focus-visible { border-bottom-color: var(--c); }

.time { display: flex; align-items: flex-start; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.field { position: relative; font-family: "D7"; font-size: clamp(52px, 11vw, 92px); line-height: 1; padding: 6px 8px 10px; cursor: text; }
.field .ghost { color: var(--ghost); display: block; }
.field input {
  position: absolute; left: 8px; top: 6px; width: calc(100% - 16px); height: calc(1em + 2px);
  font: inherit; line-height: 1; letter-spacing: inherit;
  color: var(--soft); background: transparent; border: 0; padding: 0; margin: 0;
  caret-color: transparent; text-shadow: 0 0 .05em rgba(var(--rgb), .5);
}
.field:focus-within input { color: var(--c); }
.field:focus-within::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; background: var(--c); }
.err .field input { visibility: hidden; }
.colon { font-family: "D7"; font-size: clamp(52px, 11vw, 92px); line-height: 1; padding: 6px clamp(4px, 1vw, 12px) 10px; color: var(--soft); }
.lbl { font-size: 12px; color: var(--soft); }

.switches { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px clamp(28px, 5vw, 48px); }
.sw { display: flex; align-items: center; gap: 16px; font-size: 13px; }
.sw .l, .sw .r { color: var(--dim); transition: color .15s; }
.sw[aria-pressed="false"] .l, .sw[aria-pressed="true"] .r { color: var(--c); }
.pill { position: relative; width: 50px; height: 24px; border: 1.5px solid rgba(var(--rgb), .5); border-radius: 12px; }
.sw:focus-visible .pill { border-color: var(--c); }
.knob { position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px rgba(var(--rgb), .5); transition: transform .18s ease; }
.sw[aria-pressed="true"] .knob { transform: translateX(26px); }

.start { font-size: 18px; padding: 18px 48px; border: 1.5px solid var(--soft); color: var(--c); }
.start:hover, .start:focus-visible { background: var(--c); color: #000; border-color: var(--c); }

.hint { font-size: 9px; color: rgba(var(--rgb), .24); text-align: center; padding: 0 16px; line-height: 1.8; }

/* ---------- Vista del reloj ---------- */
#clock { display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
#clock.nocursor { cursor: none; }
#disp { font-family: "D7"; line-height: 1; white-space: nowrap; padding-bottom: calc(var(--lab, 14px) * 2.2); }
.row { display: flex; align-items: baseline; }
.grp { position: relative; }
.grp.ms { font-size: .6em; }
.dg { position: relative; display: inline-block; }
.dg .ghost { position: absolute; left: 0; top: 0; color: var(--ghost); }
.dg .v { position: relative; color: var(--c); text-shadow: 0 0 .04em rgba(var(--rgb), .55), 0 0 .16em rgba(var(--rgb), .22); }
.sep { color: var(--c); margin: 0 .07em; }
.sep.dot { margin: 0 .035em; }
.glbl {
  position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
  margin-top: calc(var(--lab, 14px) * 1.1);
  font-family: "D14"; font-size: var(--lab, 14px); color: var(--soft); white-space: nowrap;
}
#clock.paused .v, #clock.paused .sep { color: rgba(var(--rgb), .37); text-shadow: none; }
#clock.blink .v, #clock.blink .sep { visibility: hidden; }
</style>
</head>
<body>

<main id="setup" class="view" aria-label="Configuración del reloj">
  <div class="mode" role="radiogroup" aria-label="Modo">
    <button type="button" role="radio" data-mode="timer" class="on" aria-checked="true">TIMER</button>
    <button type="button" role="radio" data-mode="countdown" aria-checked="false">COUNTDOWN</button>
  </div>

  <div class="time" id="time">
    <div class="cell"><label class="field"><span class="ghost" aria-hidden="true">88</span><input id="hh" data-max="99" inputmode="numeric" autocomplete="off" aria-label="Horas" value="00"></label><span class="lbl">HORAS</span></div>
    <div class="colon" aria-hidden="true">:</div>
    <div class="cell"><label class="field"><span class="ghost" aria-hidden="true">88</span><input id="mm" data-max="59" inputmode="numeric" autocomplete="off" aria-label="Minutos" value="00"></label><span class="lbl">MIN</span></div>
    <div class="colon" aria-hidden="true">:</div>
    <div class="cell"><label class="field"><span class="ghost" aria-hidden="true">88</span><input id="ss" data-max="59" inputmode="numeric" autocomplete="off" aria-label="Segundos" value="00"></label><span class="lbl">SEG</span></div>
  </div>

  <div class="switches">
    <button type="button" class="sw" id="swColor" aria-pressed="false" aria-label="Color: rojo o verde"><span class="l">ROJO</span><span class="pill"><span class="knob"></span></span><span class="r">VERDE</span></button>
    <button type="button" class="sw" id="swMs" aria-pressed="false" aria-label="Milisegundos"><span class="l">SIN!MS</span><span class="pill"><span class="knob"></span></span><span class="r">CON!MS</span></button>
  </div>

  <button type="button" class="start" id="start">INICIAR</button>

  <div class="hint" id="hint" aria-hidden="true"></div>
</main>

<section id="clock" class="view hidden" aria-label="Reloj">
  <div id="disp" role="timer" aria-live="off"></div>
</section>

<script>
(function () {
  "use strict";

  // ---------- Preferencias ----------
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v === "1"; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} }
  };
  var red = store.get("reloj.red", true);
  var showMs = store.get("reloj.ms", false);
  var countdownMode = false;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var setupV = $("setup"), clockV = $("clock"), disp = $("disp");
  var swColor = $("swColor"), swMs = $("swMs");
  var fields = [$("hh"), $("mm"), $("ss")];
  var touch = window.matchMedia("(hover: none)").matches;

  function applyColor() {
    root.classList.toggle("green", !red);
    swColor.setAttribute("aria-pressed", String(!red));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", "#000000");
  }
  function applyMs() { swMs.setAttribute("aria-pressed", String(showMs)); }
  applyColor(); applyMs();

  $("hint").textContent = touch
    ? "TOCA!PAUSA ! DOBLE!TOQUE!PANTALLA!COMPLETA ! MANTEN!PRESIONADO!VOLVER"
    : "ESPACIO!PAUSA ! R!REINICIAR ! ESC!VOLVER ! F!PANTALLA!COMPLETA";

  swColor.addEventListener("click", function () { red = !red; store.set("reloj.red", red); applyColor(); });
  swMs.addEventListener("click", function () { showMs = !showMs; store.set("reloj.ms", showMs); applyMs(); });
  [swColor, swMs].forEach(function (b) {
    b.addEventListener("keydown", function (e) {
      var on = b.getAttribute("aria-pressed") === "true";
      if ((e.key === "ArrowLeft" && on) || (e.key === "ArrowRight" && !on)) { e.preventDefault(); b.click(); }
    });
  });

  // ---------- Selector de modo ----------
  var modeBtns = document.querySelectorAll(".mode button");
  function setMode(cd) {
    countdownMode = cd;
    modeBtns.forEach(function (b) {
      var on = (b.dataset.mode === "countdown") === cd;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", String(on));
    });
  }
  modeBtns.forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode === "countdown"); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); setMode(false); modeBtns[0].focus(); }
      if (e.key === "ArrowRight") { e.preventDefault(); setMode(true); modeBtns[1].focus(); }
    });
  });

  // ---------- Campos de dígitos ----------
  function pad(n, len) { var s = String(n); while (s.length < len) s = "0" + s; return s; }
  fields.forEach(function (el, i) {
    var max = Number(el.dataset.max);
    var typed = 0;
    el._v = 0;
    var render = function () { el.value = pad(el._v, 2); var p = el.value.length; try { el.setSelectionRange(p, p); } catch (e) {} };
    var next = function () { if (fields[i + 1]) fields[i + 1].focus(); };
    var digit = function (d) {
      var nv = typed === 0 ? d : (el._v % 10) * 10 + d;
      el._v = Math.min(nv, max);
      typed++;
      render();
      if (typed >= 2) { typed = 0; next(); }
    };
    var step = function (d) {
      var v = el._v + d;
      if (v > max) v = 0;
      if (v < 0) v = max;
      el._v = v; typed = 0; render();
    };
    el._step = step;
    el.addEventListener("focus", function () { typed = 0; render(); });
    el.addEventListener("keydown", function (e) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); digit(Number(e.key)); }
      else if (e.key === "ArrowUp") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); step(-1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); if (fields[i - 1]) fields[i - 1].focus(); }
      else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); el._v = Math.floor(el._v / 10); typed = 0; render(); }
    });
    // Respaldo para teclados de celular (que no siempre envían keydown útil)
    el.addEventListener("input", function (e) {
      var data = e.data || "";
      var m = data.match(/[0-9](?!.*[0-9])/);
      if (m) digit(Number(m[0]));
      else if (e.inputType && e.inputType.indexOf("delete") === 0) { el._v = Math.floor(el._v / 10); typed = 0; render(); }
      else render();
    });
    el.addEventListener("wheel", function (e) { e.preventDefault(); step(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  });

  function totalMs() { return ((fields[0]._v * 60 + fields[1]._v) * 60 + fields[2]._v) * 1000; }

  function flashError() {
    var t = $("time"), n = 0;
    var iv = setInterval(function () {
      t.classList.toggle("err");
      if (++n >= 6) { clearInterval(iv); t.classList.remove("err"); }
    }, 110);
  }

  // ---------- Audio: bip-bip de 880 Hz con Web Audio API ----------
  var actx = null, scheduled = [], beepPending = false;

  function ensureAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) { try { actx = new AC(); } catch (e) { actx = null; return; } }
    if (actx.state === "suspended") {
      var p = actx.resume();
      if (p && p.then) p.then(function () {
        if (beepPending && S.running && S.countdown) scheduleBeep(remainingMs() / 1000);
      }).catch(function () {});
    }
  }

  // La alarma usa un solo oscilador de 880 Hz cuyo volumen se abre y cierra en un patrón
  // bip-bip que se repite cada segundo hasta que el usuario la detiene.
  var alarm = null;               // { osc, gain, nextT, timer }
  var PERIOD = 1.0;               // segundos entre cada bip-bip
  var LOOKAHEAD = 3;              // segundos programados por adelantado
  var PRESCHEDULE = 10;           // ciclos programados de entrada (cubre pestañas en segundo plano)

  function addCycle(a) {
    var g = a.gain.gain;
    [0, 0.24].forEach(function (off) {
      var t = a.nextT + off;
      g.setValueAtTime(0, t);
      g.linearRampToValueAtTime(0.4, t + 0.008);   // ataque corto, sin clic
      g.setValueAtTime(0.4, t + 0.14);
      g.linearRampToValueAtTime(0, t + 0.16);      // caída corta
    });
    a.nextT += PERIOD;
  }

  function fillAlarm() {
    if (!alarm || !actx) return;
    while (alarm.nextT < actx.currentTime + LOOKAHEAD) addCycle(alarm);
  }

  function cancelBeep() {
    beepPending = false;
    if (!alarm) return;
    var a = alarm;
    alarm = null;
    clearInterval(a.timer);
    try {
      var t = actx.currentTime, g = a.gain.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0, t + 0.02);
      a.osc.stop(t + 0.03);
    } catch (e) {}
  }

  /** Programa la alarma para dentro de `delaySec` segundos, sobre el reloj del audio. */
  function scheduleBeep(delaySec) {
    cancelBeep();
    if (!actx || actx.state !== "running") { beepPending = true; return; }
    var t0 = actx.currentTime + Math.max(0, delaySec);
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0, actx.currentTime);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(t0);
    alarm = { osc: osc, gain: gain, nextT: t0, timer: 0 };
    for (var i = 0; i < PRESCHEDULE; i++) addCycle(alarm);
    alarm.timer = setInterval(fillAlarm, 250);
  }

  // ---------- Wake Lock (mantener la pantalla encendida) ----------
  var wakeLock = null;
  function lockScreen() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  function unlockScreen() { if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; } }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !clockV.classList.contains("hidden")) lockScreen();
  });

  // ---------- Reloj ----------
  var S = { countdown: false, target: 0, ms: false, hours: false, startT: 0, acc: 0, running: false, finished: false, finishedAt: 0, alert: false };
  var parts = [];  // { v: elemento, len: dígitos, last: texto }
  var raf = 0, guard = 0;

  function now() { return performance.now(); }
  function elapsed() { return S.acc + (S.running ? now() - S.startT : 0); }

  function remainingMs() { return Math.max(0, S.target - elapsed()); }

  function build() {
    disp.innerHTML = "";
    parts = [];
    var row = document.createElement("div");
    row.className = "row";
    var spec = [];
    if (S.hours) spec.push(["HORAS", 2]);
    spec.push(["MINUTOS", 2], ["SEGUNDOS", 2]);
    if (S.ms) spec.push(["MILISEG", 3]);
    spec.forEach(function (s, i) {
      var isMs = S.ms && i === spec.length - 1;
      var g = document.createElement("div");
      g.className = "grp" + (isMs ? " ms" : "");
      var dg = document.createElement("span");
      dg.className = "dg";
      var gh = document.createElement("span");
      gh.className = "ghost";
      gh.setAttribute("aria-hidden", "true");
      gh.textContent = s[1] === 3 ? "888" : "88";
      var v = document.createElement("span");
      v.className = "v";
      v.textContent = s[1] === 3 ? "000" : "00";
      dg.appendChild(gh); dg.appendChild(v);
      var lb = document.createElement("span");
      lb.className = "glbl";
      lb.textContent = s[0];
      g.appendChild(dg); g.appendChild(lb);
      row.appendChild(g);
      parts.push({ v: v, gh: gh, len: s[1], last: "" });
      if (i < spec.length - 1) {
        var sep = document.createElement("span");
        var dot = S.ms && i === spec.length - 2;
        sep.className = "sep" + (dot ? " dot" : "");
        sep.textContent = dot ? "." : ":";
        row.appendChild(sep);
      }
    });
    disp.appendChild(row);
    fit();
  }

  function fit() {
    if (clockV.classList.contains("hidden")) return;
    disp.style.fontSize = "100px";
    var row = disp.firstChild;
    if (!row) return;
    var w = row.getBoundingClientRect().width;
    var W = clockV.clientWidth, H = clockV.clientHeight;
    var size = Math.min(W * 0.9 / w * 100, H * 0.5);
    disp.style.fontSize = size + "px";
    disp.style.setProperty("--lab", Math.max(11, size * 0.11) + "px");
  }
  window.addEventListener("resize", fit);

  function displayValue() {
    var e = elapsed();
    if (S.target > 0 && e > S.target) e = S.target;
    if (S.countdown) {
      var r = S.target - e;
      if (!S.ms) r = Math.ceil(r / 1000) * 1000;   // sin ms, el countdown redondea hacia arriba
      return r;
    }
    return e;
  }

  function setText(p, txt) {
    if (p.last !== txt) {
      p.v.textContent = txt;
      if (txt.length !== p.gh.textContent.length) { p.gh.textContent = txt.replace(/./g, "8"); }
      p.last = txt;
    }
  }

  function render() {
    var v = Math.floor(displayValue());
    var h = Math.floor(v / 3600000), m = Math.floor(v / 60000) % 60, s = Math.floor(v / 1000) % 60, x = v % 1000;
    if (!S.hours) m += h * 60;
    var vals = [];
    if (S.hours) vals.push(pad(h, 2));
    vals.push(pad(m, 2), pad(s, 2));
    if (S.ms) vals.push(pad(x, 3));
    for (var i = 0; i < parts.length; i++) setText(parts[i], vals[i]);

    clockV.classList.toggle("paused", !S.running && !S.finished);
    var blinkOff = S.alert && Math.floor((Date.now() - S.finishedAt) / 450) % 2 === 1;
    clockV.classList.toggle("blink", blinkOff);
  }

  function check() {
    if (S.running && S.target > 0 && elapsed() >= S.target) {
      S.acc = S.target;
      S.running = false;
      S.finished = true;
      S.finishedAt = Date.now();
      S.alert = true;   // parpadeo (y alarma en countdown) hasta que el usuario lo detenga
      if (S.countdown && beepPending) { ensureAudio(); scheduleBeep(0); }
    }
  }

  function loop() {
    check();
    render();
    raf = requestAnimationFrame(loop);
  }

  function begin(cd, target, withMs) {
    S.countdown = cd;
    S.target = target;
    S.ms = withMs;
    S.hours = target >= 3600000 || (!cd && target === 0);
    S.acc = 0;
    S.finished = false;
    S.alert = false;
    S.running = true;
    S.startT = now();
    build();
    if (S.countdown) scheduleBeep(target / 1000); else cancelBeep();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
    clearInterval(guard);
    guard = setInterval(check, 250);  // por si la pestaña queda en segundo plano
    lockScreen();
    render();
  }

  /** Detiene la alarma y el parpadeo; el reloj queda fijo en su valor final. */
  function stopAlert() {
    cancelBeep();
    S.alert = false;
    render();
  }

  function togglePause() {
    if (S.finished) { stopAlert(); return; }
    ensureAudio();
    if (S.running) {
      S.acc = elapsed();
      S.running = false;
      cancelBeep();
    } else {
      S.startT = now();
      S.running = true;
      if (S.countdown) scheduleBeep(remainingMs() / 1000);
    }
    render();
  }

  function restart() { ensureAudio(); begin(S.countdown, S.target, S.ms); }

  function showClock() {
    var total = totalMs();
    if (countdownMode && total <= 0) { flashError(); return; }
    ensureAudio();   // el audio solo puede activarse tras un gesto del usuario
    if (document.activeElement) document.activeElement.blur();
    setupV.classList.add("hidden");
    clockV.classList.remove("hidden");
    begin(countdownMode, total, showMs);
    bumpCursor();
  }

  function showSetup() {
    cancelAnimationFrame(raf);
    clearInterval(guard);
    cancelBeep();
    S.running = false;
    unlockScreen();
    clockV.classList.add("hidden");
    clockV.classList.remove("nocursor");
    setupV.classList.remove("hidden");
    fields[0].focus();
  }

  function toggleFullscreen() {
    var d = document;
    var el = d.documentElement;
    var fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (fsEl) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
      else { var req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } }
    } catch (e) {}
  }
  document.addEventListener("fullscreenchange", function () { setTimeout(fit, 50); });

  $("start").addEventListener("click", showClock);

  // ---------- Teclado ----------
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var inClock = !clockV.classList.contains("hidden");
    var k = e.key;
    if (k === "F11") return; // deja la pantalla completa nativa del navegador
    if (!inClock) {
      if (k === "Enter") { e.preventDefault(); showClock(); }
      else if ((k === "f" || k === "F") && e.target.tagName !== "INPUT") { e.preventDefault(); toggleFullscreen(); }
      return;
    }
    if (S.alert) {
      // Cualquier tecla detiene la alarma. R, Esc, F y C además hacen su acción.
      stopAlert();
      if (!/^(r|R|Escape|f|F|c|C)$/.test(k)) { e.preventDefault(); return; }
    }
    if (k === " " || k === "Spacebar") { e.preventDefault(); togglePause(); }
    else if (k === "r" || k === "R") { e.preventDefault(); restart(); }
    else if (k === "Escape") { e.preventDefault(); showSetup(); }
    else if (k === "f" || k === "F") { e.preventDefault(); toggleFullscreen(); }
    else if (k === "c" || k === "C") { e.preventDefault(); red = !red; store.set("reloj.red", red); applyColor(); }
  });

  // ---------- Gestos en el reloj: toque, doble toque, mantener presionado ----------
  var taps = 0, tapTimer = 0, pressTimer = 0, longFired = false, downX = 0, downY = 0, swallow = false;
  clockV.addEventListener("pointerdown", function (e) {
    if (S.alert) { stopAlert(); swallow = true; return; }   // el primer toque solo apaga la alarma
    longFired = false;
    downX = e.clientX; downY = e.clientY;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { longFired = true; taps = 0; clearTimeout(tapTimer); showSetup(); }, 700);
  });
  clockV.addEventListener("pointermove", function (e) {
    if (Math.abs(e.clientX - downX) > 12 || Math.abs(e.clientY - downY) > 12) clearTimeout(pressTimer);
    bumpCursor();
  });
  clockV.addEventListener("pointerup", function () {
    if (swallow) { swallow = false; return; }
    clearTimeout(pressTimer);
    if (longFired) return;
    taps++;
    clearTimeout(tapTimer);
    if (taps >= 2) { taps = 0; toggleFullscreen(); return; }
    tapTimer = setTimeout(function () { taps = 0; togglePause(); }, 280);
  });
  clockV.addEventListener("pointercancel", function () { clearTimeout(pressTimer); });
  clockV.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  var cursorTimer = 0;
  function bumpCursor() {
    clockV.classList.remove("nocursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () { clockV.classList.add("nocursor"); }, 1800);
  }

  if (!touch) fields[0].focus();
})();
</script>
</body>
</html>
